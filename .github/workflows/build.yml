name: build

# Reusable: one job verifies a commit (pnpm verify, for kind web also the
# Playwright e2e on the same build, and the image build); on the default branch
# a second job pushes the image to GHCR, tagged with the commit SHA and deployed
# by digest. A change to docs only skips both: no image, no deploy PR.
# With github-packages, @nick-lukashik/* install from GitHub Packages with the
# run's GITHUB_TOKEN, in pnpm and in the image build (secret "npmrc").
# Implements the CI part of the service runtime contract. Docs: docs/ci.md.

on:
  workflow_call:
    inputs:
      kind:
        description: "Service kind: web (Next.js: pnpm verify, then pnpm test:e2e on that build) or api (NestJS: pnpm verify)."
        type: string
        required: true
      services:
        description: "Service containers for the integration tests, comma-separated: postgres, redis, rabbitmq. Exported as TEST_DATABASE_URL, TEST_REDIS_URL, TEST_RABBITMQ_URL. Only what the service uses."
        type: string
        default: ""
      publish:
        description: "Push the image on the default branch. Starters pass !github.event.repository.is_template, examples false."
        type: boolean
        default: true
      github-packages:
        description: "Authenticate pnpm to GitHub Packages for @nick-lukashik/* dependencies, in verify and in the image build (the Dockerfile mounts the secret npmrc at /root/.npmrc)."
        type: boolean
        default: false
    outputs:
      image:
        description: "Image name without tag, e.g. ghcr.io/nick-lukashik/landing-web. Empty if not published."
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: "Digest of the pushed image (sha256:...). Empty if not published."
        value: ${{ jobs.image.outputs.digest }}
      tag:
        description: "Short SHA tag, e.g. sha-1a2b3c4. Empty if not published."
        value: ${{ jobs.image.outputs.tag }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # only used with github-packages: true
    concurrency:
      group: ${{ github.workflow }}-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      image: ${{ steps.mode.outputs.image }}
      image-name: ${{ steps.mode.outputs.image-name }}
      publish: ${{ steps.mode.outputs.publish }}
    services:
      # An empty image disables the container. Exact versions and throwaway
      # credentials as in compose.yaml of nest-example and nest-starter;
      # Renovate updates the tags.
      postgres:
        image: ${{ contains(inputs.services, 'postgres') && 'postgres:18.6-alpine' || '' }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: ${{ contains(inputs.services, 'redis') && 'redis:8.10.3-alpine' || '' }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: ${{ contains(inputs.services, 'rabbitmq') && 'rabbitmq:4.4.0-alpine' || '' }}
        env:
          RABBITMQ_DEFAULT_USER: app
          RABBITMQ_DEFAULT_PASS: app
        ports: ["5672:5672"]
        # ping answers before the AMQP listener is up; this waits for the port.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      # Two commits: HEAD^1 is the base of a PR's merge commit, or the previous
      # commit of master (squash merges only, so one push is one commit).
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve mode
        id: mode
        env:
          KIND: ${{ inputs.kind }}
          SERVICES: ${{ inputs.services }}
          PUBLISH: ${{ inputs.publish }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$KIND" in
            web | api) ;;
            *) echo "::error::kind must be web or api, got '$KIND'"; exit 1 ;;
          esac
          for s in ${SERVICES//,/ }; do
            case "$s" in
              postgres | redis | rabbitmq) ;;
              *) echo "::error::unknown service '$s', expected postgres, redis, rabbitmq"; exit 1 ;;
            esac
          done
          name=${REPO_NAME,,}
          if [[ ! $name =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::repository name '$name' is not a valid image name"
            exit 1
          fi

          # Docs only: docs/, .claude/ and *.md at the root. Anything else, a
          # manual run, or a commit without a parent counts as code.
          code=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git rev-parse -q --verify HEAD^1 > /dev/null; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$changed" ] && ! grep -qvE '^(docs/|\.claude/|[^/]+\.md$)' <<< "$changed"; then
              code=false
            fi
          fi

          publish=false
          if [ "$code" = true ] && [ "$PUBLISH" = true ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] &&
            { [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; }; then
            publish=true
          fi
          {
            echo "code=$code"
            echo "image-name=$name"
            echo "image=ghcr.io/${OWNER,,}/$name"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "$KIND, image ghcr.io/${OWNER,,}/$name, code=$code, publish=$publish"
          if [ "$code" = false ]; then
            echo "::notice::Docs-only change: verify, e2e and the image are skipped"
          fi

      - name: Set up pnpm
        if: steps.mode.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node.js
        if: steps.mode.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Cache Next.js build
        if: steps.mode.outputs.code == 'true' && inputs.kind == 'web'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # pnpm ignores credentials with variables in a repository's .npmrc: a user
      # config with a placeholder, the token in env of the install only (as in
      # smoke.yml). The image build gets a file with the token as a build secret.
      - name: Registry credentials
        if: steps.mode.outputs.code == 'true' && inputs.github-packages
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          # shellcheck disable=SC2016
          printf '//npm.pkg.github.com/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/registry.npmrc"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/image.npmrc"

      - name: Install dependencies
        if: steps.mode.outputs.code == 'true'
        env:
          GITHUB_PACKAGES: ${{ inputs.github-packages }}
          NPM_TOKEN: ${{ inputs.github-packages && secrets.GITHUB_TOKEN || '' }}
          USERCONFIG: ${{ runner.temp }}/registry.npmrc
        run: |
          if [ "$GITHUB_PACKAGES" = true ]; then export NPM_CONFIG_USERCONFIG=$USERCONFIG; fi
          pnpm install --frozen-lockfile

      # The names test/global-setup.ts reads instead of starting Testcontainers.
      - name: Export test services
        if: steps.mode.outputs.code == 'true' && inputs.services != ''
        env:
          SERVICES: ${{ inputs.services }}
        run: |
          for s in ${SERVICES//,/ }; do
            case "$s" in
              postgres) echo "TEST_DATABASE_URL=postgres://app:app@localhost:5432/app" >> "$GITHUB_ENV" ;;
              redis) echo "TEST_REDIS_URL=redis://localhost:6379" >> "$GITHUB_ENV" ;;
              rabbitmq) echo "TEST_RABBITMQ_URL=amqp://app:app@localhost:5672" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Verify
        if: steps.mode.outputs.code == 'true'
        run: pnpm verify

      # kind web: Playwright on the build pnpm verify just made (no second
      # install or build).
      - name: Install Playwright browser
        if: steps.mode.outputs.code == 'true' && inputs.kind == 'web'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: End-to-end tests
        if: steps.mode.outputs.code == 'true' && inputs.kind == 'web'
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure() && steps.mode.outputs.code == 'true' && inputs.kind == 'web'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Pull requests check that the image builds, with the layer cache of master.
      # On master the image job builds and pushes instead.
      - name: Set up Docker Buildx
        if: steps.mode.outputs.code == 'true' && steps.mode.outputs.publish != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without push
        if: steps.mode.outputs.code == 'true' && steps.mode.outputs.publish != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          secret-files: ${{ inputs.github-packages && format('npmrc={0}/image.npmrc', runner.temp) || '' }}
          cache-from: type=gha,scope=${{ steps.mode.outputs.image-name }}

  image:
    name: image
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.workflow }}-image-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      image: ${{ needs.verify.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Short SHA tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Registry credentials
        if: inputs.github-packages
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/image.npmrc"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ needs.verify.outputs.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=sha,format=long,prefix=

      # mode=max keeps the dependency layers too: the next build of master and
      # every pull request reuse them while the lockfile is unchanged.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: APP_VERSION=${{ github.sha }}
          secret-files: ${{ inputs.github-packages && format('npmrc={0}/image.npmrc', runner.temp) || '' }}
          cache-from: type=gha,scope=${{ needs.verify.outputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ needs.verify.outputs.image-name }}

      - name: Summary
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### Image"
            echo
            echo "- \`$IMAGE@$DIGEST\`"
            echo "- tags: \`$TAG\`, \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
