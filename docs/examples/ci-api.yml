# Copy to .github/workflows/ci.yml of an api service (NestJS, from nest-starter).
# Docs: docs/ci.md.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

jobs:
  # Job id "ci" gives the required check "ci / verify".
  ci:
    uses: nick-lukashik/.github/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      kind: api
      # Only what the service uses (postgres, redis, rabbitmq), exported as
      # TEST_DATABASE_URL, TEST_REDIS_URL, TEST_RABBITMQ_URL instead of Testcontainers.
      services: postgres
      # A repo created from the template publishes; the template itself only verifies.
      publish: ${{ !github.event.repository.is_template }}

  deploy:
    needs: ci
    if: needs.ci.outputs.digest != ''
    uses: nick-lukashik/.github/.github/workflows/deploy-pr.yml@v1
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.ci.outputs.image }}
      digest: ${{ needs.ci.outputs.digest }}
    secrets:
      DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      OPS_TELEGRAM_TOKEN: ${{ secrets.OPS_TELEGRAM_TOKEN }}
